  <circle cx="20" cy="19.5" r="2.2" fill="#ffc107"/>
  <circle cx="26.5" cy="19.5" r="2.2" fill="#ffc107"/>
  <circle cx="33" cy="19.5" r="2.2" fill="#ffc107"/>
